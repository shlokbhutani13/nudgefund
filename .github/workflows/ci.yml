name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-expo-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-expo-app/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check Expo compatibility
        run: npx expo-doctor

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

      - name: Check Edge Function
        run: deno check --config ../supabase/functions/deno.json ../supabase/functions/financial-coach/index.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser verification
        run: npm run test:e2e
